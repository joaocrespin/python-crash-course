{% extends 'blogs/base.html' %}

{% block content %}

<p><a href="{% url 'blog:blog' blog.id  %}">{{ blog }}</a></p>

<p>Add a new entry:</p>
<form action="{% url 'blog:new_post' blog.id %}" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Add post</button>
</form>

{% endblock content %}
