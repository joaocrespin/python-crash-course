{% extends 'blogs/base.html' %}

{% block content %}

<p><a href="{% url 'blog:blog' blog.id  %}">{{ blog }}</a></p>

<p>Edit post:</p>
<form action="{% url 'blog:edit_post' post.id %}" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Save changes</button>
</form>

{% endblock content %}
