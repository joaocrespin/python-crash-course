{% extends 'blogs/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
  <h2><a href="{% url 'blog:blog' blog.id  %}">{{ blog }}</a></h2>
{% endblock page_header %}

{% block content %}
  <p>Edit post:</p>
  <form action="{% url 'blog:edit_post' post.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>

{% endblock content %}
