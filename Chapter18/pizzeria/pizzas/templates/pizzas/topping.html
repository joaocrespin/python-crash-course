{% extends 'pizzas/base.html' %}

{% block content %}
<p>Pizza: {{ pizza.name }}</p>

<p>Toppings:</p>
<ul>
    {% for topping in toppings %}
        <!-- <li>{{ topping.date_added|date:'M d, Y H:i' }}</li> -->
        <li>{{ topping.name|linebreaks }}</li>
    {% empty %}
        <li>No toppings for this pizza yet.</li>
    {% endfor %}
</ul>
{% endblock content %}
